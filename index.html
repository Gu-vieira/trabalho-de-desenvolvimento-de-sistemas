<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Help Desk</title>

    <link
        rel="stylesheet"
        href="./css/style.css"
    >

</head>

<body>

    <header class="header">

        <h1>Sistema Help Desk</h1>

    </header>

    <main class="container">

        <section class="formSection">

            <h2>Abertura de Chamados</h2>

            <form id="ticketForm">

                <input
                    type="text"
                    id="ticketTitle"
                    placeholder="Título do chamado"
                    required
                >

                <textarea
                    id="ticketDescription"
                    placeholder="Descrição do problema"
                    required
                ></textarea>

                <select
                    id="ticketStatus"
                    required
                >

                    <option value="">
                        Selecione o status
                    </option>

                    <option>
                        Aberto
                    </option>

                    <option>
                        Em andamento
                    </option>

                    <option>
                        Concluído
                    </option>

                </select>

                <button type="submit">
                    Cadastrar Chamado
                </button>

            </form>

        </section>

        <section class="tableSection">

            <h2>Lista de Chamados</h2>

            <table>

                <thead>

                    <tr>

                        <th>ID</th>

                        <th>Título</th>

                        <th>Status</th>

                    </tr>

                </thead>

                <tbody id="ticketList">
                </tbody>

            </table>

        </section>

    </main>

    <script src="./js/script.js"></script>

</body>

</html>
